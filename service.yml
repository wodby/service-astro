name: astro
type: service
from: node
fromVersionConstraint: "^2.0.0"
fromVersion: "2.3.1"
guidance: GUIDANCE.md
title: Node.js (Astro)
labels:
- astro
- node

env:
# The standalone server of the @astrojs/node adapter listens on HOST and PORT.
# Without them it listens on localhost and the port of the Astro
# configuration (4321 by default), which the gateway cannot reach.
- name: HOST
  value: 0.0.0.0
- name: PORT
  value: '3000'
- name: WORKSPACE_NODE_COMMAND
  value: exec node node_modules/astro/bin/astro.mjs dev --host "$HOST" --port 
    "$PORT"
- name: NODE_ENV
  value: production
  envType: dev

build:
  dockerfile: Dockerfile
  # The default build context plus the build output and generated types of a
  # local build, which the image build creates again.
  dockerignoreContent: |
    .git
    .gitignore
    .dockerignore
    .wodby-ci-cache
    dist
    .astro
  connect: true
  boilerplates:
  - name: astro
    title: Astro Boilerplate
    repo: https://github.com/wodby/astro-boilerplate
    branch: main

workspace:
  reload: watch
  # Build output and the types Astro generates for the project.
  ignore: ['/dist/', '/.astro/']
